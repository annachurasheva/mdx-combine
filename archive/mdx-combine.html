<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDX-комбайн</title>
<script src="https://unpkg.com/turndown/dist/turndown.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #7eb8da; margin-bottom: 16px; font-size: 20px; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: #9ab; font-size: 13px; }
  input, textarea { width: 100%; padding: 8px 10px; background: #16213e; color: #e0e0e0; border: 1px solid #334; border-radius: 4px; font-size: 14px; font-family: monospace; }
  input:focus, textarea:focus { outline: none; border-color: #7eb8da; }
  #pasteArea { min-height: 200px; max-height: 400px; resize: vertical; }
  #pasteArea:focus { background: #1a2744; }
  .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px; font-weight: 600; }
  .btn-create { background: #3b82f6; color: #fff; }
  .btn-create:hover { background: #2563eb; }
  .btn-copy { background: #334; color: #e0e0e0; margin-left: 8px; }
  .btn-copy:hover { background: #445; }
  #output { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #111; padding: 12px; border-radius: 4px; max-height: 500px; overflow-y: auto; margin-top: 12px; display: none; border: 1px solid #334; }
  .hint { font-size: 12px; color: #678; margin-top: 4px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .status { margin-top: 8px; font-size: 13px; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
</style>
</head>
<body>

<h1>HTML &rarr; Markdown + Frontmatter для Astro</h1>

<div class="row">
  <div class="field">
    <label>Заголовок поста</label>
    <input type="text" id="title" placeholder="Моя статья">
  </div>
  <div class="field">
    <label>Имя файла (без расширения)</label>
    <input type="text" id="filename" placeholder="my-post">
  </div>
</div>

<div class="row">
  <div class="field">
    <label>Авторы (через запятую)</label>
    <input type="text" id="authors" placeholder="nevzorov-b-i, rsl">
  </div>
  <div class="field">
    <label>Теги (через запятую)</label>
    <input type="text" id="tags" placeholder="Tag1, Tag2">
  </div>
</div>

<div class="field">
  <label>Description (для SEO)</label>
  <input type="text" id="description" placeholder="Краткое описание статьи">
</div>

<div class="field">
  <label>Вставь HTML сюда (Ctrl+V — вставка скопированного со страницы)</label>
  <div contenteditable="true" id="pasteArea" style="min-height:200px;max-height:400px;resize:vertical;overflow-y:auto;padding:8px 10px;background:#16213e;color:#e0e0e0;border:1px solid #334;border-radius:4px;font-size:14px;line-height:1.5;" spellcheck="false"></div>
  <div class="hint">Вставляй текст, скопированный прямо со страницы — браузер передаст HTML с форматированием</div>
</div>

<button class="btn btn-create" onclick="generate()">Создать .md</button>
<button class="btn btn-copy" onclick="copyOutput()" id="copyBtn" style="display:none">Копировать</button>
<button class="btn btn-copy" onclick="downloadFile()" id="dlBtn" style="display:none">Скачать .md</button>

<div class="status" id="status"></div>

<pre id="output"></pre>

<script>
function slugify(text) {
  const map = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };
  return text.toLowerCase().split('').map(c => map[c] || c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function generate() {
  const title = document.getElementById('title').value.trim() || 'new-post';
  const filename = (document.getElementById('filename').value.trim() || slugify(title));
  const authorsRaw = document.getElementById('authors').value.trim();
  const tagsRaw = document.getElementById('tags').value.trim() || 'Tag';
  const description = document.getElementById('description').value.trim();
  const pasteArea = document.getElementById('pasteArea');

  // Получаем HTML из contenteditable
  const rawHTML = pasteArea.innerHTML;
  if (!rawHTML.trim() || rawHTML === '<br>') {
    document.getElementById('status').innerHTML = '<span class="err">❌ Вставь HTML-контент</span>';
    return;
  }

  // Конвертация HTML → Markdown
  const turndownService = new TurndownService({
    headingStyle: 'atx',
    codeBlockStyle: 'fenced',
    bulletListMarker: '-',
    emDelimiter: '*'
  });

  // Правила для лучшей конвертации
  turndownService.addRule('strikethrough', {
    filter: ['del','s','strike'],
    replacement: content => '~~' + content + '~~'
  });

  let markdown = turndownService.turndown(rawHTML);

  // Очистка лишних пустых строк
  markdown = markdown.replace(/\n{3,}/g, '\n\n').trim();

  // Frontmatter
  const now = new Date().toISOString();
  const authorIds = authorsRaw ? authorsRaw.split(',').map(a => a.trim()).filter(Boolean) : [];
  const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);

  let fm = '---\n';
  fm += `title: ${title}\n`;
  fm += `published: ${now}\n`;
  fm += `description: '${description}'\n`;
  fm += `updated: ''\n`;
  fm += `tags:\n`;
  tags.forEach(t => fm += `  - ${t}\n`);
  fm += `draft: false\n`;
  fm += `pin: 0\n`;
  fm += `toc: true\n`;
  fm += `lang: ''\n`;
  fm += `abbrlink: ''\n`;
  if (authorIds.length > 0) {
    fm += `authorIds:\n`;
    authorIds.forEach(a => fm += `  - ${a}\n`);
  }
  fm += `---\n\n`;

  const fullContent = fm + markdown + '\n';
  window._mdContent = fullContent;
  window._mdFilename = filename + '.md';

  // Показать результат
  const out = document.getElementById('output');
  out.textContent = fullContent;
  out.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('dlBtn').style.display = 'inline-block';

  document.getElementById('status').innerHTML = `<span class="ok">✅ Готово: ${filename}.md — ${markdown.length} символов контента</span>`;
}

function copyOutput() {
  navigator.clipboard.writeText(window._mdContent).then(() => {
    document.getElementById('status').innerHTML = '<span class="ok">📋 Скопировано в буфер</span>';
  });
}

function downloadFile() {
  const blob = new Blob([window._mdContent], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = window._mdFilename;
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('status').innerHTML = `<span class="ok">💾 Скачать: ${window._mdFilename}</span>`;
}
</script>
</body>
</html>
